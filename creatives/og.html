<!doctype html><html lang="uk"><head><meta charset="utf-8"><style>
@font-face{font-family:'Unbounded';font-weight:200 900;src:url(../fonts/unbounded-cyrillic-wght-normal.woff2) format('woff2');unicode-range:U+0400-045F,U+0490-0491}
@font-face{font-family:'Unbounded';font-weight:200 900;src:url(../fonts/unbounded-latin-wght-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+2212}
@font-face{font-family:'Ubuntu';font-weight:500;src:url(../fonts/ubuntu-cyrillic-500-normal.woff2) format('woff2');unicode-range:U+0400-045F,U+0490-0491}
@font-face{font-family:'Ubuntu';font-weight:500;src:url(../fonts/ubuntu-latin-500-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
*{margin:0;box-sizing:border-box}
#og{width:1200px;height:630px;position:relative;overflow:hidden;background:#120E08;color:#FFF6ED;font-family:'Ubuntu'}
#og img.bg{position:absolute;right:0;top:-140px;width:620px}

.logo{position:absolute;left:64px;top:52px;display:flex;gap:14px;align-items:center;font:600 22px/1.05 'Unbounded'}
.logo img{width:64px;height:64px}
h1{position:absolute;left:64px;top:150px;width:600px;font:700 48px/1.08 'Unbounded';letter-spacing:-.02em}
p{position:absolute;left:66px;top:340px;width:560px;font:500 26px/1.35 'Ubuntu';color:rgba(255,246,237,.85)}
.pill{position:absolute;left:64px;top:470px;background:linear-gradient(180deg,#F7D98C,#EFC76C 55%,#E2B44E);color:#120E08;font:700 24px 'Unbounded';padding:20px 30px;border-radius:999px}
</style></head><body><div id="og">
<img class="bg" src="src/bg-test.jpg" alt=""><div class="fade"></div>
<div class="logo"><img src="../img/logo.webp" alt="">Лавка<br>Мольфара</div>
<h1>Ритуал Мольфара: який у тебе тип напруги?</h1>
<p>7 питань, персональна карта і подарунок до курсу Магнію Гліцинату</p>
<div class="pill">Пройти за 60 секунд</div>
</div></body></html>
